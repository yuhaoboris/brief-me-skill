<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">本地素材搜索：已确定的系统边界</title>
  <desc id="desc">方案评审已完成，导入尚未实现。流程为导入、提取文本、建索引、搜索；教师确认标签后可搜索。提取失败保留原文件并可重试。原文件保留，SQLite 存元数据，索引可重建。不做云同步或学生使用记录。没有性能数据。</desc>
  <rect width="1600" height="1100" fill="#f5f3ed" />
  <text x="70" y="92" fill="#173d45" font-family="Hiragino Sans GB" font-size="46px" font-weight="650">本地素材搜索：已确定的系统边界</text>
  <text x="72" y="140" fill="#4e666b" font-family="Hiragino Sans GB" font-size="25px">方案评审完成；导入尚未实现。图中为已确定的设计，不代表功能已交付。</text>

  <rect x="55" y="194" width="1490" height="725" rx="24" fill="#ffffff" stroke="#6c989c" stroke-width="2.5" />
  <rect x="80" y="216" width="175" height="43" rx="12" fill="#e6f1ed" />
  <text x="107" y="246" fill="#173d45" font-family="Hiragino Sans GB" font-size="27px" font-weight="600">本机范围内</text>
  <text x="108" y="303" fill="#4e666b" font-family="Hiragino Sans GB" font-size="22px">已确定的处理流程</text>

  <rect x="105" y="330" width="265" height="122" rx="16" fill="#fff6e6" stroke="#b77d32" stroke-width="2" />
  <text x="235" y="380" text-anchor="middle" fill="#173d45" font-family="Hiragino Sans GB" font-size="29px" font-weight="600">导入</text>
  <text x="235" y="420" text-anchor="middle" fill="#91530b" font-family="Hiragino Sans GB" font-size="22px">尚未实现</text>
  <rect x="445" y="330" width="265" height="122" rx="16" fill="#edf5f4" stroke="#8baeb0" stroke-width="2" />
  <text x="577" y="400" text-anchor="middle" fill="#173d45" font-family="Hiragino Sans GB" font-size="29px" font-weight="600">提取文本</text>
  <rect x="785" y="330" width="265" height="122" rx="16" fill="#edf5f4" stroke="#8baeb0" stroke-width="2" />
  <text x="917" y="400" text-anchor="middle" fill="#173d45" font-family="Hiragino Sans GB" font-size="29px" font-weight="600">建索引</text>
  <rect x="1125" y="330" width="310" height="122" rx="16" fill="#edf5f4" stroke="#8baeb0" stroke-width="2" />
  <text x="1280" y="380" text-anchor="middle" fill="#173d45" font-family="Hiragino Sans GB" font-size="29px" font-weight="600">搜索</text>
  <text x="1280" y="420" text-anchor="middle" fill="#4e666b" font-family="Hiragino Sans GB" font-size="22px">教师确认标签后可搜索</text>

  <rect x="405" y="512" width="490" height="102" rx="14" fill="#fff8ed" stroke="#d7b889" stroke-width="1.5" />
  <text x="432" y="551" fill="#91530b" font-family="Hiragino Sans GB" font-size="24px">提取失败</text>
  <text x="432" y="590" fill="#173d45" font-family="Hiragino Sans GB" font-size="24px">保留原文件，可重试提取</text>
  <text x="108" y="704" fill="#173d45" font-family="Hiragino Sans GB" font-size="27px" font-weight="600">本地数据各有职责</text>
  <rect x="105" y="735" width="390" height="130" rx="14" fill="#f5f7f5" />
  <text x="132" y="782" fill="#173d45" font-family="Hiragino Sans GB" font-size="29px" font-weight="600">原文件</text>
  <text x="132" y="828" fill="#173d45" font-family="Hiragino Sans GB" font-size="24px">持续保留</text>
  <rect x="565" y="735" width="410" height="130" rx="14" fill="#f5f7f5" />
  <text x="592" y="782" fill="#173d45" font-family="Hiragino Sans GB" font-size="29px" font-weight="600">SQLite</text>
  <text x="592" y="828" fill="#173d45" font-family="Hiragino Sans GB" font-size="24px">存放元数据</text>
  <rect x="1045" y="735" width="390" height="130" rx="14" fill="#f5f7f5" />
  <text x="1072" y="782" fill="#173d45" font-family="Hiragino Sans GB" font-size="29px" font-weight="600">搜索索引</text>
  <text x="1072" y="828" fill="#173d45" font-family="Hiragino Sans GB" font-size="24px">可以重建</text>

  <rect x="55" y="945" width="1490" height="83" rx="14" fill="#ebe9e3" />
  <text x="82" y="996" fill="#173d45" font-family="Hiragino Sans GB" font-size="24px">本次范围外：云同步 · 学生使用记录</text>
  <text x="945" y="996" fill="#173d45" font-family="Hiragino Sans GB" font-size="24px">尚无证据：性能数据</text>
  <text x="141" y="1071" font-size="20" fill="#4e666b" font-family="Hiragino Sans GB">实线：设计流程</text>
  <text x="486" y="1071" font-size="20" fill="#4e666b" font-family="Hiragino Sans GB">虚线：失败与重试</text>
  <text x="1100" y="1071" font-size="20" fill="#4e666b" font-family="Hiragino Sans GB">依据：当前对话中的方案记录</text>
