</style></head><body><div id="root"></div><noscript><main style="padding-top:40px"><p>交互需要启用 JavaScript。以下是核心内容。</p><h1>DeepSeek Harness 的核心结构</h1><p>依据来自两轮讨论及分析附件，未重新核验源码。图的分组属于模型整理。</p><section style="margin:24px 0"><h2>启动装配</h2><p>创建容器，再把配置变成运行中的插件树。</p><p>bundle 是组合清单。preset 决定会话能力。它们都不是执行循环。</p></section><section style="margin:24px 0"><h2>插件运行底座</h2><p>负责服务解析、插件注册、事件和生命周期。</p><p>插件能替换，是因为仍遵守这套运行机制。卸载插件不等于无损迁移状态。</p></section><section style="margin:24px 0"><h2>Agent 接口</h2><p>统一控制接口。注册表使用工厂创建或恢复 Agent。</p><p>接口不负责执行任务。默认循环提供工厂；其他实现必须满足相同契约。</p></section><section style="margin:24px 0"><h2>执行循环</h2><p>接收输入，处理模型输出，调度工具，控制任务退出。</p><p>保留默认循环，就要保留它依赖的服务。服务实现可以换，职责不能空缺。</p></section><section style="margin:24px 0"><h2>会话日志</h2><p>保存事件日志，并从日志推导模型可见的历史。</p><p>内存日志是默认循环的依赖。跨进程恢复需要落盘；JSONL 只是后端的一种实现。</p></section><section style="margin:24px 0"><h2>能力服务</h2><p>为循环提供三项服务。这里按职责合并展示。</p><p>LLM 服务需要有效 adapter。工具注册表可以没有具体工具。Web UI、skills 和定时任务并非每次模型交互都需要。</p></section><section style="margin:24px 0"><h2>状态与作用域</h2><p>Projection 提供事件状态投影。Scope 负责 Agent 注册与事件隔离。</p><p>图中的“投影”连接只指 Projection。Scope 是隔离注册与事件的库；它不是安全沙箱，也不是 Projection 的下一步。</p></section><h2>主要关系</h2><p><strong>配置 → 运行中的插件</strong>：启动模块创建容器，再把 profile、bundle 和 patch 转成插件树。</p><p><strong>注册表 → 工厂 → Agent</strong>：Registry 通过 Factory 创建或恢复 Agent。默认循环提供这个工厂。</p><p><strong>会话日志 → 模型请求历史</strong>：Session 从事件日志推导历史。循环使用这份历史构造模型请求。</p><p><strong>执行循环 → 能力服务</strong>：循环依赖模型、工具和提示词服务。这三项服务共同支撑任务执行。</p><p><strong>状态投影 → 执行循环</strong>：默认循环依赖 sessionProjections 服务。它提供事件的状态投影。</p></main></noscript><script>"use strict";(()=>{var by=Object.create;var Ym=Object.defineProperty;var gy=Object.getOwnPropertyDescriptor;var hy=Object.getOwnPropertyNames;var yy=Object.getPrototypeOf,Ey=Object.prototype.hasOwnProperty;var Sy=(e,t,n)=>()=>{if(n)throw n[0];try{return e&&(t=e(e=0)),t}catch(l){throw n=[l],l}};var _t=(e,t)=>()=>{try{return t||e((t={exports:{}}).exports,t),t.exports}catch(n){throw t=0,n}};var Ty=(e,t,n,l)=>{if(t&&typeof t=="object"||t
