  font-size: 10px;
  border-radius: 4px;
  padding: 4px 6px;
  white-space: nowrap;
  flex-shrink: 0;
}
.status-source {
  color: #4b7d57;
  background: #e7efdf;
}
.status-inference {
  color: #9a7033;
  background: #f4ecdb;
}
.status-unknown {
  color: #7f8473;
  background: #eceee5;
}
.source-accordions {
  margin-top: 25px;
}
.source-original {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: var(--font-sans);
  font-size: 12px;
  line-height: 1.9;
  color: #63755a;
  background: #f1f4eb;
  border-radius: 8px;
  padding: 16px;
  max-height: 330px;
  overflow-y: auto;
  margin-top: 14px;
}
.version-item {
  border-bottom: 1px solid #e4eadd;
  padding: 0 0 16px;
  margin-bottom: 16px;
}
.version-item time {
  font-size: 11px;
  color: #8c987f;
  float: right;
}
.version-item p {
  font-size: 13px;
  line-height: 1.8;
  color: #647858;
  margin: 14px 0 0;
}
.muted-note {
  font-size: 11px;
  line-height: 1.85;
  color: #869279;
  margin: 7px 0;
}
.mobile-map {
  display: none;
}
.skip-link {
  position: fixed;
  top: -70px;
  left: 20px;
  background: white;
  padding: 10px 15px;
  z-index: 100;
  font-size: 13px;
}
.skip-link:focus {
  top: 10px;
}
@media (min-width: 1560px) {
  .workspace {
    grid-template-columns: minmax(0, 1fr) 350px;
  }
}
@media (max-width: 1100px) and (min-width: 761px) {
  .site-header {
    padding-left: 24px;
    padding-right: 24px;
  }
  main {
    padding-left: 24px;
    padding-right: 24px;
  }
  .workspace {
    grid-template-columns: minmax(0, 1fr) 278px;
    gap: 15px;
  }
  .hero-aside {
    display: none;
  }
  .map-node {
    padding: 8px;
  }
  .node-name {
    font-size: 11px;
  }
  .node-short {
    font-size: 9px;
  }
  .node-english {
    font-size: 8px;
    margin: 2px 0 4px;
  }
  .node-number {
    display: none;
  }
  .foundation-title strong {
    font-size: 12px;
  }
  .foundation-title > span:nth-child(2) > span {
    font-size: 9px;
  }
  .edge-label {
    font-size: 9px;
    padding: 3px 6px;
  }
  .detail-panel {
    padding: 19px 17px;
  }
}
@media (max-width: 900px) {
  .workspace {
    grid-template-columns: 1fr;
  }
  .detail-panel {
    min-height: auto;
  }
  .overview-steps {
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .overview-steps button > .icon {
    display: none;
  }
  .takeaway {
    margin-top: 20px;
  }
  .node-name {
    font-size: 15px;
  }
  .node-short {
    font-size: 12px;
  }
  .node-english {
    font-size: 10px;
  }
}
@media (max-width: 760px) {
  .site-header {
    padding: 17px 18px;
  }
  main {
    padding: 0 16px 24px;
  }
  .header-slash, .header-label {
    display: none;
  }
  .hero {
    padding: 26px 2px;
  }
  .hero-aside {
    display: none;
  }
  h1 {
    font-size: 25px;
    letter-spacing: -.8px;
  }
  .hero-description {
    font-size: 12px;
    line-height: 1.85;
    margin-top: 10px;
  }
  .eyebrow {
    font-size: 10px;
  }
  .workspace {
    gap: 18px;
  }
  .desktop-map {
    display: none;
  }
  .mobile-map {
    display: block;
    padding: 18px 12px 12px;
  }
  .mobile-node {
    position: static;
    width: 100%;
    min-height: 94px;
    padding: 12px;
  }
  .mobile-map > .mobile-node {
    width: 74%;
    margin: auto;
  }
  .mobile-node .node-name {
    font-size: 13px;
  }
  .mobile-node .node-english {
    font-size: 9px;
    margin: 4px 0;
    white-space: normal;
  }
  .mobile-node .node-short {
    font-size: 10px;
    white-space: normal;
  }
  .mobile-node .node-number {
    display: none;
  }
  .mobile-assemble {
    display: flex;
    margin: 11px auto;
    font-size: 11px;
  }
  .mobile-foundation {
    padding: 13px 10px 10px;
    background: #f3f7ee;
    border: 1px solid #dce4d4;
    border-radius: 10px;
  }
  .mobile-foundation-title {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    width: 100%;
    margin-bottom: 13px;
  }
  .mobile-foundation-title .icon {
    width: 14px;
  }
  .mobile-foundation-title .icon:last-child {
    margin-left: auto;
  }
  .mobile-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
  }
  .mobile-grid .loop-node {
    grid-column: 1 / -1;
    grid-row: 1;
    min-height: 100px;
  }
  .mobile-relations {
    padding: 18px 4px 4px;
  }
  .mobile-relations > p {
    margin-bottom: 7px;
  }
  .mobile-relations button {
    display: grid;
    grid-template-columns: 1fr 65px 1fr;
    gap: 6px;
    width: 100%;
    padding: 10px 0;
    font-size: 11px;
    border-bottom: 1px solid #eaf0e3;
    align-items: center;
  }
  .mobile-relations button > span:last-child {
    text-align: right;
  }
  .mobile-relation-label {
    text-align: center;
    color: #7a9470;
    font-size: 10px;
  }
  .map-footer {
    font-size: 9px;
    padding: 12px;
    gap: 5px;
  }
  .map-footer > span:first-child {
    gap: 4px;
  }
  .panel-bar {
    padding: 15px 16px;
  }
  .detail-panel {
    padding: 22px;
  }
  .overview-steps {
    grid-template-columns: 1fr;
    gap: 3px;
  }
  .overview-steps button > .icon {
    display: inline-block;
  }
  .page-footer {
    flex-wrap: wrap;
    font-size: 10px;
    line-height: 1.75;
    gap: 9px;
  }
  .dialog-position {
    padding: 12px;
  }
  .dialog-panel {
    max-height: 90dvh;
    border-radius: 13px;
  }
  .dialog-heading {
    padding: 23px 20px 16px;
  }
  .tabs {
    padding: 0 20px;
  }
  .source-body {
    padding: 20px;
  }
  .provenance-row {
    flex-direction: column;
    gap: 6px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
@media print {
  .site-header button, .reset-button, .page-footer button {
    display: none;
  }
  .workspace {
    display: block;
  }
  .detail-panel {
    margin-top: 20px;
    break-inside: avoid;
  }
  .map-panel {
    break-inside: avoid;
  }
  .map-node.is-muted {
    opacity: 1;
  }
}

\u6A21\u578B\u914D\u7F6E\u53D8\u66F4\u65E0\u9700\u91CD\u542F\u670D\u52A1\u5668\u3002API \u534F\u8BAE\u5FC5\u987B\u4E0E\u670D\u52A1\u7AEF\u4E00\u81F4\u3002\u5730\u5740\u80FD\u8BBF\u95EE\uFF0C\u4E0D\u4EE3\u8868\u534F\u8BAE\u517C\u5BB9\u3002[\u6A21\u578B\u914D\u7F6E\u6307\u5357](https://github.com/deepseek-ai/deepseek-harness/blob/c291e7961a515f6d7af9304e7fd1d257929aef26/docs/user/guide/providers.zh.md)

**\u516D\u3001\u5982\u4F55\u9009\u62E9\u667A\u80FD\u4F53\u7684\u80FD\u529B\u7EC4\u5408**

\u8FD9\u91CC\u9700\u8981\u533A\u5206\u4E24\u4E2A\u540D\u79F0\uFF1A

| \u540D\u79F0 | \u63A7\u5236\u8303\u56F4 | \u793A\u4F8B |
|---|---|---|
| profile\uFF1A\u5E94\u7528\u914D\u7F6E | \u6574\u4E2A\u5E94\u7528\u5982\u4F55\u542F\u52A8 | \`web\`\u3001\`headless\`\u3001\`sdk\` |
| preset\uFF1A\u4F1A\u8BDD\u9884\u8BBE | \u5355\u4E2A\u4F1A\u8BDD\u4F7F\u7528\u54EA\u4E9B\u5DE5\u5177\u548C\u8BF4\u660E | \`standard\`\u3001\`minimal\`\u3001\`ptc\`\u3001\`cordis\` |

\u7B2C\u4E00\u6B21\u4F7F\u7528\u65F6\uFF0C\u9009\u62E9 \`web\` \u5E94\u7528\u914D\u7F6E\u548C \`standard\` \u4F1A\u8BDD\u9884\u8BBE\u5373\u53EF\u3002

\u9700\u8981\u66F4\u6362\u4F1A\u8BDD\u9884\u8BBE\u65F6\uFF0C\u8BF7\u5728\u7A7A\u4F1A\u8BDD\u4E2D\u9009\u62E9\u3002\u4F1A\u8BDD\u4EA7\u751F\u5185\u5BB9\u540E\uFF0C\u8BE5\u7248\u672C\u4E0D\u5141\u8BB8\u5207\u6362\u9884\u8BBE\u3002\u6B64\u65F6\u9700\u8981\u65B0\u5EFA\u4F1A\u8BDD\u3002[\u4F1A\u8BDD\u9884\u8BBE\u8BF4\u660E](https://github.com/deepseek-ai/deepseek-harness/blob/c291e7961a515f6d7af9304e7fd1d257929aef26/packages/preset/agent-presets/README.zh.md)

**\u4E03\u3001\u5982\u4F55\u4F7F\u7528\u6280\u80FD**

\u6280\u80FD\u9002\u5408\u4FDD\u5B58\u91CD\u590D\u6D41\u7A0B\u3002\u4F8B\u5982\u4EE3\u7801\u5BA1\u67E5\u6B65\u9AA4\u3001\u6D4B\u8BD5\u89C4\u5219\u6216\u62A5\u544A\u683C\u5F0F\u3002

\u5728\u542F\u7528\u4E86\u672C\u5730\u6280\u80FD\u529F\u80FD\u7684\u4F1A\u8BDD\u4E2D\uFF1A

1. \u5C06\u6280\u80FD\u76EE\u5F55\u653E\u5165\u9879\u76EE\u7684 \`.dsh/skills/\`\u3002
2. \u5728\u6280\u80FD\u76EE\u5F55\u4E2D\u653E\u7F6E \`SKILL.md\`\u3002
3. \u5728\u6587\u4EF6\u5F00\u5934\u586B\u5199 \`name\` \u548C \`description\`\u3002
4. \u5728\u6587\u4EF6\u6B63\u6587\u4E2D\u7F16\u5199\u64CD\u4F5C\u6B65\u9AA4\u3002
5. \u5728\u4F1A\u8BDD\u4E2D\u8981\u6C42\u667A\u80FD\u4F53\u4F7F\u7528\u8BE5\u6280\u80FD\u3002

\u4F8B\u5982\uFF1A

> \u4F7F\u7528\u9879\u76EE\u4E2D\u7684\u4EE3\u7801\u5BA1\u67E5\u6280\u80FD\u3002\u68C0\u67E5\u672C\u6B21\u4FEE\u6539\u3002

\u9ED8\u8BA4\u626B\u63CF\u8DEF\u5F84\u4E5F\u5305\u62EC\u9879\u76EE\u7684 \`.agents/skills/\`\u3002\u6280\u80FD\u4E0D\u4F1A\u81EA\u52A8\u589E\u52A0\u65B0\u7684\u5916\u90E8\u7CFB\u7EDF\u63A5\u53E3\uFF1B\u65B0\u589E\u63A5\u53E3\u901A\u5E38\u9700\u8981\u5DE5\u5177\u63D2\u4EF6\u6216 MCP \u914D\u7F6E\u3002[\u6280\u80FD\u8BF4\u660E](https://github.com/deepseek-ai/deepseek-harness/blob/c291e7961a515f6d7af9304e7fd1d257929aef26/packages/skill/skill-filesystem/README.zh.md)

**\u516B\u3001\u5982\u4F55\u5728\u7EC8\u7AEF\u8FD0\u884C\u4E00\u6B21\u4EFB\u52A1**

\u524D\u63D0\uFF1A\u5DF2\u7ECF\u6784\u5EFA\u9879\u76EE\uFF0C\u5E76\u914D\u7F6E\u6709\u6548\u7684\u6A21\u578B\u51ED\u636E\u3002

\u5728\u6E90\u7801\u76EE\u5F55\u6267\u884C\uFF1A

\`\`\`bash
pnpm dsh --profile headless "\u8BF4\u660E\u5F53\u524D\u4ED3\u5E93\u7684\u4E3B\u8981\u6A21\u5757\u3002\u4E0D\u8981\u4FEE\u6539\u6587\u4EF6\u3002"
\`\`\`

**\u9884\u671F\u7ED3\u679C\uFF1A** \u7A0B\u5E8F\u521B\u5EFA\u4F1A\u8BDD\uFF0C\u6267\u884C\u4EFB\u52A1\uFF0C\u8F93\u51FA\u6700\u7EC8\u7B54\u6848\uFF0C\u7136\u540E\u9000\u51FA\u3002\u5B83\u4E0D\u4F1A\u542F\u52A8\u7F51\u9875\u670D\u52A1\u3002\u8FD0\u884C\u547D\u4EE4\u65F6\u6240\u5728\u7684\u76EE\u5F55\u662F\u9ED8\u8BA4\u5DE5\u4F5C\u533A\u3002[CLI \u8BF4\u660E](https://github.com/deepseek-ai/deepseek-harness/blob/c291e7961a515f6d7af9304e7fd1d257929aef26/apps/cli/README.zh.md)

\u9700\u8981\u5728\u81EA\u5DF1\u7684\u7A0B\u5E8F\u4E2D\u63A7\u5236\u4EFB\u52A1\u65F6\uFF0C\u4F7F\u7528 SDK\u3002\`sdk\` \u6A21\u5F0F\u7528\u4E8E\u7A0B\u5E8F\u901A\u4FE1\uFF0C\u4E0D\u662F\u4EA4\u4E92\u5F0F\u804A\u5929\u7EC8\u7AEF\u3002

**\u4E5D\u3001\u9700\u8981\u65B0\u529F\u80FD\u65F6\uFF0C\u5982\u4F55\u5904\u7406\u63D2\u4EF6**

\u5148\u68C0\u67E5\u529F\u80FD\u662F\u5426\u5DF2\u542F\u7528\uFF1A

\`\`\`bash
pnpm dsh --profile web --dump-config
\`\`\`

\u8BE5\u547D\u4EE4\u663E\u793A\u7EC4\u5408\u540E\u7684\u914D\u7F6E\uFF0C\u4E0D\u542F\u52A8\u7F51\u9875\u5E94\u7528\u3002

\u5B89\u88C5\u5916\u90E8\u63D2\u4EF6\u65F6\uFF0C\u547D\u4EE4\u683C\u5F0F\u5982\u4E0B\u3002\u8BF7\u5C06 \`\u63D2\u4EF6\u5305\u540D\` \u66FF\u6362\u6210\u5B9E\u9645\u5305\u540D\uFF1A

\`\`\`bash
pnpm dsh plugin --profile web add \u63D2\u4EF6\u5305\u540D
\`\`\`
